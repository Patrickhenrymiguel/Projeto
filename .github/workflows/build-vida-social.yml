name: Build Vida Social APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout config
        uses: actions/checkout@v4
        with:
          path: config

      - name: Checkout SA-MP 2.11 upstream
        uses: actions/checkout@v4
        with:
          repository: kuzia15/SAMP-Mobile
          ref: GTA-2.11
          path: appsrc

      - name: Apply Vida Social branding and server
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("appsrc")

          p = root / "app/src/main/res/values/strings.xml"
          s = p.read_text(encoding="utf-8")
          s = s.replace("<string name=\"app_name\">GTA 2.11</string>", "<string name=\"app_name\">Vida Social</string>")
          s = s.replace("<string name=\"play_bth\">START!</string>", "<string name=\"play_bth\">JOGAR</string>")
          s = s.replace("<string name=\"client_name\">SA:MP 2.11 </string>", "<string name=\"client_name\">VIDA SOCIAL</string>")
          s = s.replace("<string name=\"bug_info\">Found a bug? Report it, and I\\'ll fix it!</string>", "<string name=\"bug_info\">Vs-Rp Samp Launcher • 15.204.150.91:29418</string>")
          s = s.replace("<string name=\"authors\">thanks to bkuzn and afobazl</string>", "<string name=\"authors\">Vida Social RolePlay • Android ARM64</string>")
          p.write_text(s, encoding="utf-8")

          p = root / "app/src/main/cpp/samp/settings.cpp"
          s = p.read_text(encoding="utf-8")
          s = s.replace('Log("Error: can\'t load %s", buff);\n\t\tstd::terminate();\n\t\treturn;', 'Log("Vida Social: settings.ini not found; using safe defaults.");')
          s = s.replace('reader.Get("client", "host", "141.95.234.17")', 'reader.Get("client", "host", "15.204.150.91")')
          s = s.replace('reader.GetInteger("client", "port", 1417)', 'reader.GetInteger("client", "port", 29418)')
          needle = '\tm_Settings.iPort = reader.GetInteger("client", "port", 29418);'
          if needle in s and 'strncpy(m_Settings.szHost, "15.204.150.91"' not in s:
              s = s.replace(needle, needle + '\n\tstrncpy(m_Settings.szHost, "15.204.150.91", MAX_SETTINGS_STRING - 1);\n\tm_Settings.szHost[MAX_SETTINGS_STRING - 1] = \'\\0\';\n\tm_Settings.iPort = 29418;')
          p.write_text(s, encoding="utf-8")

          p = root / "app/build.gradle.kts"
          s = p.read_text(encoding="utf-8").replace('val apkName = "GTA-2.11-${buildType.name}.apk"', 'val apkName = "Vida-Social-Vs-Rp-${buildType.name}.apk"')
          p.write_text(s, encoding="utf-8")

          p = root / "app/src/main/res/layout/main_activity.xml"
          p.write_text("""<?xml version="1.0" encoding="utf-8"?>
<RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
    android:layout_width="match_parent"
    android:layout_height="match_parent"
    android:background="#100810"
    android:padding="20dp">

    <ImageView
        android:id="@+id/vidaLogo"
        android:layout_width="330dp"
        android:layout_height="210dp"
        android:layout_centerInParent="true"
        android:alpha="0.98"
        android:contentDescription="@string/app_name"
        android:scaleType="fitCenter"
        android:src="@drawable/vida_social_logo" />

    <TextView
        android:id="@+id/title1"
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:layout_alignParentStart="true"
        android:layout_alignParentTop="true"
        android:layout_marginStart="18dp"
        android:layout_marginTop="18dp"
        android:text="@string/client_name"
        android:textColor="#FF4FC3"
        android:textSize="28sp"
        android:textStyle="bold" />

    <TextView
        android:id="@+id/title2"
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:layout_alignStart="@id/title1"
        android:layout_below="@id/title1"
        android:layout_marginTop="4dp"
        android:text="@string/samp_ver"
        android:textColor="#E6E6E6"
        android:textSize="14sp" />

    <TextView
        android:id="@+id/bugText"
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:layout_above="@id/authorText"
        android:layout_alignStart="@id/authorText"
        android:layout_marginBottom="6dp"
        android:text="@string/bug_info"
        android:textColor="#FFFFFF"
        android:textSize="14sp" />

    <TextView
        android:id="@+id/authorText"
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:layout_alignParentBottom="true"
        android:layout_alignParentStart="true"
        android:layout_marginBottom="18dp"
        android:layout_marginStart="18dp"
        android:text="@string/authors"
        android:textColor="#FF85D5"
        android:textSize="12sp" />

    <Button
        android:id="@+id/startButton"
        android:layout_width="190dp"
        android:layout_height="64dp"
        android:layout_alignParentBottom="true"
        android:layout_alignParentEnd="true"
        android:layout_marginBottom="18dp"
        android:layout_marginEnd="18dp"
        android:background="@drawable/button"
        android:elevation="8dp"
        android:text="@string/play_bth"
        android:textColor="#FFFFFF"
        android:textSize="20sp"
        android:textStyle="bold" />
</RelativeLayout>
""", encoding="utf-8")

          p = root / "app/src/main/AndroidManifest.xml"
          s = p.read_text(encoding="utf-8").replace('android:icon="@drawable/ic_launcher_background"', 'android:icon="@drawable/vida_social_icon"')
          p.write_text(s, encoding="utf-8")
          PY

          cp config/branding/vida_social_256.png appsrc/app/src/main/res/drawable/vida_social_logo.png
          cp config/branding/vida_social_256.png appsrc/app/src/main/res/drawable/vida_social_icon.png

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK / NDK / CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;26.2.11394342" "cmake;3.22.1"

      - name: Build APK
        working-directory: appsrc
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        working-directory: appsrc
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          test -n "$APK"
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose "$APK"
          cp "$APK" ../Vida-Social-Vs-Rp.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Vida-Social-Vs-Rp-APK
          path: Vida-Social-Vs-Rp.apk
          if-no-files-found: error
          retention-days: 30
