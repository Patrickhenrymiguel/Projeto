name: Build Vida Social APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SA-MP Mobile GTA 2.11 source
        uses: actions/checkout@v4
        with:
          repository: kuzia15/SAMP-Mobile
          ref: GTA-2.11
          path: appsrc

      - name: Apply Vida Social settings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("appsrc")

          p = root / "app/src/main/res/values/strings.xml"
          s = p.read_text(encoding="utf-8")
          s = s.replace("GTA 2.11", "Vida Social")
          s = s.replace("START!", "JOGAR")
          s = s.replace("SA:MP 2.11", "VIDA SOCIAL")
          p.write_text(s, encoding="utf-8")

          p = root / "app/src/main/cpp/samp/settings.cpp"
          s = p.read_text(encoding="utf-8")
          s = s.replace("141.95.234.17", "15.204.150.91")
          s = s.replace("1417", "29418")
          p.write_text(s, encoding="utf-8")

          p = root / "app/build.gradle.kts"
          s = p.read_text(encoding="utf-8")
          s = s.replace("GTA-2.11-", "Vida-Social-Vs-Rp-")
          p.write_text(s, encoding="utf-8")
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android dependencies
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;26.2.11394342" "cmake;3.22.1"

      - name: Build APK
        working-directory: appsrc
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK artifact
        shell: bash
        run: |
          APK=$(find appsrc/app/build/outputs/apk/debug -name "*.apk" | head -1)
          test -n "$APK"
          cp "$APK" Vida-Social-Vs-Rp.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose Vida-Social-Vs-Rp.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vida-Social-Vs-Rp-APK
          path: Vida-Social-Vs-Rp.apk
          if-no-files-found: error
