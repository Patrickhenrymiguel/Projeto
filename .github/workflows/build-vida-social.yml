name: Build Vida Social APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SA-MP Mobile GTA 2.11 source
        uses: actions/checkout@v4
        with:
          repository: kuzia15/SAMP-Mobile
          ref: GTA-2.11
          path: appsrc

      - name: Apply Vida Social settings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("appsrc")

          p = root / "app/src/main/res/values/strings.xml"
          s = p.read_text(encoding="utf-8")
          s = s.replace("GTA 2.11", "Vida Social")
          s = s.replace("START!", "JOGAR")
          s = s.replace("SA:MP 2.11", "VIDA SOCIAL")
          s = s.replace("Found a bug? Report it, and I\\'ll fix it!", "VIDA SOCIAL ROLEPLAY")
          s = s.replace("thanks to bkuzn and afobazl", "Vs-Rp Samp Launcher")
          p.write_text(s, encoding="utf-8")

          # Linux is case-sensitive; upstream includes playertablist.h
          # while gui.h references playerTabList.h.
          p = root / "app/src/main/cpp/samp/gui/gui.h"
          s = p.read_text(encoding="utf-8")
          s = s.replace("samp_widgets/playerTabList.h", "samp_widgets/playertablist.h")
          p.write_text(s, encoding="utf-8")

          p = root / "app/src/main/cpp/samp/game/rgba.cpp"
          s = p.read_text(encoding="utf-8")
          s = s.replace('#include "RGBA.h"', '#include "rgba.h"')
          p.write_text(s, encoding="utf-8")

          p = root / "app/src/main/cpp/samp/settings.cpp"
          s = p.read_text(encoding="utf-8")
          s = s.replace("141.95.234.17", "15.204.150.91")
          s = s.replace("1417", "29418")
          s = s.replace(
              'if(reader.ParseError() < 0)\\n\\t{\\n\\t\\tLog("Error: can\\'t load %s", buff);\\n\\t\\tstd::terminate();\\n\\t\\treturn;\\n\\t}',
              'if(reader.ParseError() < 0)\\n\\t{\\n\\t\\tLog("Settings file not found, using Vida Social defaults.");\\n\\t}'
          )
          p.write_text(s, encoding="utf-8")

          p = root / "app/build.gradle.kts"
          s = p.read_text(encoding="utf-8")
          s = s.replace("GTA-2.11-", "Vida-Social-Vs-Rp-")
          s = s.replace(
              'jniLibs {\n            excludes.add("META-INF/*")\n        }',
              'jniLibs {\n            excludes.add("META-INF/*")\n            pickFirsts.add("lib/arm64-v8a/libbass.so")\n        }'
          )
          p.write_text(s, encoding="utf-8")
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME=/usr/local/lib/android/sdk
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(command -v sdkmanager)
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;26.2.11394342" "cmake;3.22.1"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: appsrc
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK artifact
        shell: bash
        run: |
          APK=$(find appsrc/app/build/outputs/apk/debug -name "*.apk" | head -1)
          test -n "$APK"
          cp "$APK" Vida-Social-Vs-Rp.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose Vida-Social-Vs-Rp.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vida-Social-Vs-Rp-APK
          path: Vida-Social-Vs-Rp.apk
          if-no-files-found: error
