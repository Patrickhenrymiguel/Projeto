name: Prepare APK editing tools
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/apk-tools.yml']
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch APK tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir tools
          gh release download --repo iBotPeaches/Apktool --pattern '*.jar' --dir tools
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/aapt2" tools/
          mkdir tools/lib
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" tools/lib/
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-tools
          path: tools/
          retention-days: 3
